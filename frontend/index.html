<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Sentinel</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf2f2;background:#101417;line-height:1.45}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1160px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #344044;padding-bottom:20px}h1{letter-spacing:.08em;font-size:26px}h2{margin-top:0}button{border:0;background:#d6f36b;color:#101417;padding:10px 15px;font-weight:700;cursor:pointer}button.danger{background:#ff7568}.live{display:flex;gap:8px;align-items:center;color:#d6f36b;font-size:13px}.dot{width:8px;height:8px;background:#d6f36b;border-radius:50%}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.stat,article{border:1px solid #344044;padding:18px;background:#182024}.stat b{display:block;font-size:30px;color:#d6f36b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #344044}tbody tr{cursor:pointer}tbody tr:hover{background:#202b30}tbody tr.selected{background:#2f4347;box-shadow:inset 0 0 0 2px #d6f36b}.risk{font-weight:800;color:#ffcf66}.action-pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.action-pill.allow{background:rgba(143,227,141,.18);color:#8fe38d}.action-pill.block{background:rgba(255,117,104,.18);color:#ff7568}.action-pill.review{background:rgba(255,207,102,.18);color:#ffcf66}.action-pill.monitor{background:rgba(255,255,255,.08);color:#dfe7eb}.detail{margin-top:18px;display:none}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.label{color:#9eafb2;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.value{font-size:20px}.reasons{padding-left:20px}.actions{display:flex;gap:10px;margin-top:18px}@media(max-width:720px){body{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><div><div class="live"><span class="dot"></span>LIVE MONITORING</div><h1>API SENTINEL</h1></div><button onclick="load()">Refresh</button></header>
<section class="metrics" id="stats"></section>
<article><h2>Incidents</h2><table><thead><tr><th>ID</th><th>Threat</th><th>Endpoint</th><th>Risk</th><th>Facie</th><th>Action</th></tr></thead><tbody id="incidents"></tbody></table></article>
<article class="detail" id="detail"><h2 id="detail-title"></h2><div class="detail-grid"><div><div class="label">Threat</div><div class="value" id="detail-threat"></div></div><div><div class="label">Endpoint</div><div class="value" id="detail-endpoint"></div></div><div><div class="label">Risk</div><div class="value" id="detail-risk"></div></div><div><div class="label">Facie confidence</div><div class="value" id="detail-confidence"></div></div></div><p class="label">Why Sentinel flagged it</p><ul class="reasons" id="detail-reasons"></ul><p><span class="label">Current action</span><br><strong id="detail-action"></strong></p><div class="actions"><button onclick="overrideIncident('ALLOW')">Override: Allow</button><button class="danger" onclick="overrideIncident('BLOCK')">Keep Blocked</button></div></article>
</main>
<script>
const backendOrigin = window.__API_SENTINEL_BACKEND__ || `${window.location.protocol === 'file:' ? 'http:' : window.location.protocol}//${window.location.hostname || '127.0.0.1'}:8000`;
const api=backendOrigin.replace(/\/$/, '');
let selected=null;

async function fetchJson(url, options={}) {
  const response = await fetch(url, options);
  if (!response.ok) {
    throw new Error(`Request failed: ${response.status} ${response.statusText}`);
  }
  return response.json();
}

function actionClass(action='ALLOW') {
  return String(action).toLowerCase();
}

function highlightSelectedRow() {
  const rows = document.querySelectorAll('#incidents tr');
  rows.forEach((row) => {
    const isSelected = Number(row.dataset.id) === Number(selected?.id ?? -1);
    row.classList.toggle('selected', isSelected);
    row.style.background = isSelected ? '#2f4347' : '';
    row.style.boxShadow = isSelected ? 'inset 0 0 0 2px #d6f36b' : '';
  });
}

async function load(){
  try {
    const [stats,incidents]=await Promise.all([
      fetchJson(api+'/api/stats'),
      fetchJson(api+'/api/incidents')
    ]);
    const facieLabel = stats.facie?.status === 'ready' ? `READY · ${stats.facie.states} states` : 'OFFLINE';
    document.querySelector('#stats').innerHTML=[['APIs Protected',stats.apis_protected],['Requests',stats.requests],['Threats',stats.threats],['Blocked',stats.blocked],['Critical',stats.critical],['Facie Engine',facieLabel]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('');
    document.querySelector('#incidents').innerHTML=incidents.map(x=>`<tr data-id="${x.id}" onclick="showIncident(${x.id})" class="${selected && selected.id === x.id ? 'selected' : ''}"><td>INC-${x.id}</td><td>${x.threat_type}</td><td>${x.endpoint}</td><td class="risk">${x.risk_score}/100</td><td><span class="action-pill ${actionClass(x.ai_action || x.action)}">${x.ai_action || x.action}</span></td><td><span class="action-pill ${actionClass(x.action)}">${x.action}</span></td></tr>`).join('');
    highlightSelectedRow();
  } catch (error) {
    console.error('Failed to refresh Sentinel dashboard', error);
  }
}

async function showIncident(id){
  try {
    selected=await fetchJson(api+'/api/incidents/'+id);
    const events=await fetchJson(api+'/api/events');
    const event=events.find(x=>x.id===selected.event_id);
    document.querySelector('#detail').style.display='block';
    document.querySelector('#detail-title').textContent='INCIDENT #'+id;
    document.querySelector('#detail-threat').textContent=selected.threat_type;
    document.querySelector('#detail-endpoint').textContent=selected.endpoint;
    document.querySelector('#detail-risk').textContent=selected.risk_score+'/100';
    document.querySelector('#detail-confidence').textContent=selected.ai_confidence ? Math.round(selected.ai_confidence*100)+'%' : 'n/a';
    document.querySelector('#detail-action').textContent=selected.action;
    document.querySelector('#detail-action').style.color = selected.action === 'ALLOW' ? '#8fe38d' : selected.action === 'BLOCK' ? '#ff7568' : '#ffcf66';
    document.querySelector('#detail-reasons').innerHTML=(event?.reason||'Security rule matched').split('; ').map(x=>`<li>${x}</li>`).join('');
    document.querySelector('#detail').scrollIntoView({behavior:'smooth'});
    highlightSelectedRow();
  } catch (error) {
    console.error('Failed to fetch incident details', error);
  }
}

async function overrideIncident(action){
  if(!selected)return;
  try {
    const result = await fetchJson(api+'/api/incidents/'+selected.id+'/override',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,reason:'Reviewed in Sentinel dashboard',reviewer:'dashboard-user'})
    });
    selected = { ...selected, action: result.action, status: result.status };
    await load();
    await showIncident(selected.id);
  } catch (error) {
    console.error('Failed to override incident', error);
  }
}

load();
const socket=new WebSocket(api.replace(/^http/, 'ws')+'/ws/events');
socket.onmessage=load;
</script></body></html>
